# Configuration PRODUCTION (VPS + Traefik)
# ─────────────────────────────────────────
# Utilisée automatiquement par `docker compose up` sur le VPS.
# Pour le développement local, utiliser :
#   docker compose -f docker-compose.dev.yml up
#
# Prérequis VPS :
#   - Traefik tourne et est rattaché au réseau Docker externe `web` :
#       docker network create web
#   - Le certresolver `letsencrypt` est configuré côté Traefik.
#   - Un répertoire `./data` existe (créé automatiquement au premier up).

services:
  planning-famille:
    build: .
    image: planning-famille:latest
    container_name: planning-famille
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3051
      - PILOT_ADMIN_KEY=${PILOT_ADMIN_KEY:?Définir PILOT_ADMIN_KEY dans le fichier .env du VPS}
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.planning-famille.rule=Host(`planning.bandtrack.fr`)"
      - "traefik.http.routers.planning-famille.entrypoints=websecure"
      - "traefik.http.routers.planning-famille.tls.certresolver=letsencrypt"
      - "traefik.http.services.planning-famille.loadbalancer.server.port=3051"

networks:
  web:
    external: true
